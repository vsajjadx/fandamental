name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine tests
        run: node tests/engine.test.js
      - name: Data-layer tests
        run: node tests/data.test.js
      - name: AI-layer tests
        run: node tests/ai.test.js
      - name: Site self-containment (no CDN, all assets published)
        run: node tests/site.test.js
      - name: Trading setups engine (patterns, no look-ahead, per-setup backtest)
        run: node tests/setups.test.js
      - name: Crypto token screener (real CoinGecko snapshot)
        run: node tests/tokens.test.js
      - name: Volume + free news-tone fundamental
        run: node tests/fundamental.test.js
      - name: Multi-timeframe view
        run: node tests/mtf.test.js
      - name: MT5 bridge (web side)
        run: node tests/mt5.test.js
      - name: MT5 direct mode (no server) end to end with simulated EA
        run: node tests/mt5_direct.test.js

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: API tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end with simulated EA
        run: python tests/e2e_ea_sim.py

  deploy:
    needs: [test, server-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect static site
        run: |
          mkdir _site
          cp -r index.html sw.js css js vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      # The artifact name is unique per attempt: a "Re-run" of the same workflow
      # used to leave two artifacts named "github-pages" in one run, and
      # deploy-pages@v4 aborts with "Multiple artifacts named github-pages
      # were unexpectedly found for this workflow run".
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
